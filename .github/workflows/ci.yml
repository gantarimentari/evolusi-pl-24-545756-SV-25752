name: CI Pipeline

on:
  push:
    branches: [ main, dev, "feature/*" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP Syntax
        run: |
          find app config routes -type f -name "*.php" -exec php -l {} +

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Copy .env.example
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Tests
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Staging Deployment Simulation
        run: |
          echo "Menjalankan deployment otomatis ke server staging..."
          echo "Simulasi rilis berhasil."

  production:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production Deployment Simulation
        run: |
          echo "Langkah 1: php artisan down retry=60"
          echo "Langkah 2: git pull origin main"
          echo "Langkah 3: composer install --no-dev --optimize-autoloader"
          echo "Langkah 4: php artisan migrate --force"
          echo "Langkah 5: php artisan config:cache"
          echo "Langkah 6: php artisan queue:restart"
          echo "Langkah 7: php artisan up"